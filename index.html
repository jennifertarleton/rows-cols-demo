<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rows and Columns</title>
  <style>
    :root {
      --bg: #fffcf9;
      --ink: #1e293b;
      --muted: #64748b;
      --blue: #4e89bd;
      --red: #e06c75;
      --green: #3f8f5a;
      --gold: #d79b2b;
      --line: #e2dcd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 { margin: 24px 24px 0; font-size: 1.6rem; text-align: center; }

    .stage {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      justify-content: center;
    }

    /* Code panel */
    .code {
      border: 3px solid var(--blue);
      border-radius: 14px;
      background: white;
      padding: 12px 0;
      font-family: Consolas, monospace;
      font-size: 1.08rem;
      overflow-x: auto;
    }

    .line {
      padding: 3px 18px;
      white-space: pre;
      border-left: 6px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    .line.on { background: #fff1cc; border-left-color: var(--gold); }
    .line.bug { background: #fbe1e3; border-left-color: var(--red); }

    .tok { border-radius: 4px; padding: 0 2px; transition: background 0.3s, color 0.3s, opacity 0.3s; }
    .tok.win { background: var(--gold); color: var(--ink); font-weight: 700; }
    .tok.off { opacity: 0.35; }
    .tok.bad { background: var(--red); color: white; font-weight: 700; }

    /* The pretend browser window */
    .window-track { display: flex; justify-content: center; }

    .window {
      width: 100%;
      min-width: 250px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: white;
      overflow: hidden;
      transition: width 0.6s ease-in-out;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #f1ede7;
      border-bottom: 2px solid var(--line);
      font-weight: 700;
      white-space: nowrap;
    }

    .bar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
    .bar .size { margin-left: auto; font-family: Consolas, monospace; color: var(--blue); }

    .grid-wrap { position: relative; padding: 10px 12px 14px; }

    .slots, .numbers, .cards {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
    }

    .slots { position: absolute; inset: 10px 12px 14px; }
    .slots div { background: #eef4fa; border-radius: 4px; }
    .numbers { position: relative; margin-bottom: 8px; }
    .numbers div { text-align: center; font-family: Consolas, monospace; font-size: 0.75rem; color: var(--blue); }

    .cards { position: relative; row-gap: 10px; min-height: 96px; transition: opacity 0.4s; }
    .cards.hide { opacity: 0; }

    .card {
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: white;
      padding: 8px 6px;
      text-align: center;
      min-width: 0;
    }

    .card .emoji { font-size: 1.8rem; }
    .card .name { font-weight: 700; }
    .card .span { font-family: Consolas, monospace; color: var(--muted); font-size: 0.9rem; }
    .card.bug { border-color: var(--red); }

    .ask {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--gold);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .ask.show { opacity: 1; }

    .tally {
      min-height: 1.6em;
      text-align: center;
      font-family: Consolas, monospace;
      font-size: 1.25rem;
      transition: opacity 0.4s;
    }

    .tally .full { color: var(--green); font-weight: 700; }
    .tally .short { color: var(--red); font-weight: 700; }

    .caption {
      max-width: 900px;
      margin: 0 auto 8px;
      padding: 0 24px;
      min-height: 4.5em;
      font-size: 1.5rem;
      text-align: center;
    }

    code { font-family: Consolas, monospace; background: #f1ede7; padding: 1px 6px; border-radius: 4px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 24px 24px; }

    .controls button {
      padding: 10px 24px;
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .controls #next { background: var(--ink); color: white; }
    .controls button:disabled { opacity: 0.35; cursor: default; }
    .count { color: var(--muted); }

    @media (max-width: 760px) {
      .code { font-size: 0.85rem; }
      .caption { font-size: 1.2rem; }
      .tally { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Bootstrap rows: 12 columns to share</h1>

  <div class="stage">
    <div class="code" id="code"></div>

    <div class="window-track">
      <div class="window" id="window">
        <div class="bar">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="size" id="size"></span>
        </div>
        <div class="grid-wrap">
          <div class="slots" id="slots"></div>
          <div class="numbers" id="numbers"></div>
          <div class="cards" id="cards"></div>
          <div class="ask" id="ask">?</div>
        </div>
      </div>
    </div>

    <div class="tally" id="tally"></div>
  </div>

  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="back" type="button">← Back</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">Next →</button>
  </div>

  <script>
    const menu = [
      { emoji: "🌮", name: "Taco" },
      { emoji: "🌯", name: "Burrito" },
      { emoji: "🧀", name: "Nachos" }
    ];

    // Bootstrap's breakpoints: a class with this size works from this width up.
    const breakpoints = { "": 0, sm: 576, md: 768, lg: 992, xl: 1200, xxl: 1400 };

    // Read one class. Returns null if Bootstrap wouldn't know it.
    function readClass(name) {
      const m = name.match(/^col-(?:(sm|md|lg|xl|xxl)-)?(\d{1,2})$/);
      if (!m || +m[2] < 1 || +m[2] > 12) return null;
      return { from: breakpoints[m[1] || ""], span: +m[2] };
    }

    // Which class wins at this width? The biggest size that still fits.
    // No class fits: a card in a row takes the full width (12).
    function winner(classes, width) {
      let best = null;
      classes.split(" ").forEach(function (name, n) {
        const c = readClass(name);
        if (c && c.from <= width && (!best || c.from >= best.from)) best = { from: c.from, span: c.span, index: n };
      });
      return best || { span: 12, index: -1 };
    }

    const A = "col-md-4";
    const B = "col-md-6";
    const M = "col-12 col-md-6 col-lg-4";
    const BUG = "col-12 col-md-6 col-lg4";

    // Each step: caption, screen width, each card's classes, and what to show.
    const steps = [
      { text: "Bootstrap splits every <code>row</code> into <strong>12 equal columns</strong>. The cards inside the row share them.",
        width: 1000, cls: [A, A, A], line: 0, empty: true },
      { text: "<code>col-md-4</code> takes <strong>4 of the 12</strong>. 4 + 4 + 4 = 12, so 3 cards fit in one row.",
        width: 1000, cls: [A, A, A], active: true },
      { text: "Change every card to <code>col-md-6</code>. <strong>Predict:</strong> how many cards fit in the first row? Type it in the chat.",
        width: 1000, cls: [B, B, B], predict: true },
      { text: "6 + 6 = 12. The row is full, so Nachos <strong>wraps</strong> to a new row. 2 per row.",
        width: 1000, cls: [B, B, B], active: true },
      { text: "Back to <code>col-md-4</code>, on a 400px phone. <code>md</code> means <strong>768px and wider</strong>. Too narrow, so it switches off and each card takes the whole row.",
        width: 400, cls: [A, A, A], active: true },
      { text: "So we give each size its own class: <code>col-12 col-md-6 col-lg-4</code>. At 400px only <code>col-12</code> works: all 12, full width.",
        width: 400, cls: [M, M, M], active: true },
      { text: "At 800px, <code>col-md-6</code> takes over (768 and up). 6 of 12 is half: <strong>2 across</strong>.",
        width: 800, cls: [M, M, M], active: true },
      { text: "At 1000px, <code>col-lg-4</code> takes over (992 and up). 4 of 12 is a third: <strong>3 across</strong>.",
        width: 1000, cls: [M, M, M], active: true },
      { text: "At 1300px? Still <code>col-lg-4</code>. A class keeps working on <strong>every bigger screen</strong> too.",
        width: 1300, cls: [M, M, M], active: true },
      { text: "<strong>Bug hunt:</strong> Burrito's class has a typo. Spot it, then predict the layout at 1000px. Type it in the chat.",
        width: 1000, cls: [M, BUG, M], line: 2, predict: true },
      { text: "<code>col-lg4</code> is missing a dash, so Bootstrap skips it. Burrito stays at <code>col-md-6</code>: 4 + 6 = 10, and Nachos won't fit. <strong>Check every dash.</strong>",
        width: 1000, cls: [M, BUG, M], line: 2, bug: true, active: true }
    ];

    function el(id) { return document.getElementById(id); }

    // Build the 12 slots, the numbers, and the cards once.
    for (let n = 1; n <= 12; n++) {
      el("slots").appendChild(document.createElement("div"));
      const num = document.createElement("div");
      num.textContent = n;
      el("numbers").appendChild(num);
    }
    menu.forEach(function (item, n) {
      const card = document.createElement("div");
      card.className = "card";
      card.id = "card-" + n;
      card.innerHTML = '<div class="emoji">' + item.emoji + '</div><div class="name">' + item.name +
        '</div><div class="span" id="span-' + n + '"></div>';
      el("cards").appendChild(card);
    });

    function classHtml(classes, width, s) {
      const win = winner(classes, width);
      return classes.split(" ").map(function (name, n) {
        const c = readClass(name);
        let state = "";
        if (s.active) {
          if (n === win.index) state = " win";
          else if (!c && s.bug) state = " bad";
          else if (c && c.from > width) state = " off";
        }
        return '<span class="tok' + state + '">' + name + "</span>";
      }).join(" ");
    }

    // Pack the spans into rows the way the browser does: if it doesn't fit, start a new row.
    function tallyHtml(spans) {
      const rows = [];
      spans.forEach(function (span) {
        const last = rows[rows.length - 1];
        const used = last ? last.reduce(function (a, b) { return a + b; }, 0) : 12;
        if (used + span > 12) rows.push([span]);
        else last.push(span);
      });
      return rows.map(function (row, n) {
        const sum = row.reduce(function (a, b) { return a + b; }, 0);
        const sumText = row.length > 1 ? row.join(" + ") + " = " + sum : String(sum);
        return "Row " + (n + 1) + ": <span class=\"" + (sum === 12 ? "full" : "short") + "\">" + sumText + "</span>";
      }).join(" &nbsp;·&nbsp; ");
    }

    let step = 0;

    function show() {
      const s = steps[step];

      // Code
      const lines = ['&lt;div class="row g-4"&gt;'];
      menu.forEach(function (item, n) {
        lines.push('  &lt;div class="' + classHtml(s.cls[n], s.width, s) + '"&gt;' + item.emoji + " " + item.name + "&lt;/div&gt;");
      });
      lines.push("&lt;/div&gt;");
      el("code").innerHTML = lines.map(function (html, n) {
        const mark = n === s.line ? (s.bug ? " bug" : " on") : "";
        return '<div class="line' + mark + '">' + html + "</div>";
      }).join("");

      // Window
      el("window").style.width = (s.width / 1300 * 100) + "%";
      el("size").textContent = "Screen: " + s.width + "px";

      const spans = s.cls.map(function (classes) { return winner(classes, s.width).span; });
      spans.forEach(function (span, n) {
        el("card-" + n).style.gridColumn = "span " + span;
        el("span-" + n).textContent = span + " of 12";
        el("card-" + n).classList.toggle("bug", !!s.bug && n === 1);
      });

      const hidden = s.empty || s.predict;
      el("cards").classList.toggle("hide", !!hidden);
      el("ask").classList.toggle("show", !!s.predict);
      el("tally").innerHTML = hidden ? "" : tallyHtml(spans);

      el("caption").innerHTML = s.text;
      el("count").textContent = (step + 1) + " / " + steps.length;
      el("back").disabled = step === 0;
      el("next").disabled = step === steps.length - 1;
    }

    el("next").addEventListener("click", function () { if (step < steps.length - 1) { step++; show(); } });
    el("back").addEventListener("click", function () { if (step > 0) { step--; show(); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") el("next").click();
      if (e.key === "ArrowLeft") el("back").click();
    });

    show();
  </script>
</body>
</html>
